contents:
  - title: Mathematical Foundations of Biosciences
    items:
      - label: "Biomolecular modeling:"
        body: "Differential geometry-based solvation models; geometric algebra-based docking; persistent topology of biomolecules; variational multiscale models for ion channel transport; DFT of proton transport; curvature-based biomolecular surfaces; multiscale virus capsid modeling; geometric modeling of protein complexes."
      - label: "Protein and genomic systems:"
        body: "Mechanoelectrical transducers; flexibility-rigidity index (FRI) for proteins; stochastic B-factor prediction; electrostatic binding analysis; Reeb graph-based protein pocket detection; genomic data; geometric topology modeling; Mayer topology modeling; topological phylogenetics."

  - title: Mathematical Foundations of AI and Data Science
    items:
      - label: "Topology and geometry:"
        body: "Topological data analysis; topological deep learning; topological learning; persistent spectral graph; persistent Laplacian; persistent sheaf, path, hyperdigraph, Mayer, and Dirac methods; persistent commutative algebra."
      - label: "Machine learning:"
        body: "Generative network complex; graph neural networks; multiscale manifold regularization; machine learning; multitask learning; autoencoders; transformers; UMAP-assisted K-means clustering; dimensionality reduction; interaction topology."

  - title: Drug Discovery, Bioinformatics, and Quantitative Systems Pharmacology
    items:
      - label: "Molecular prediction:"
        body: "Protein-ligand binding affinity; pose prediction; MathDL; virtual screening; partition coefficient; solubility; toxicity; scoring, ranking, docking, and screening."
      - label: "Mutation and drug design:"
        body: "Protein folding stability changes upon mutation; protein-protein binding affinity; genotyping; automated generation of drug-like molecules; proteome-informed AI for drug adduction; deep mutational scanning; multiscale transformers."

  - title: Mathematical Virology and Biomedical Engineering
    items:
      - label: "Virology:"
        body: "Virus evolution, infectivity, vaccine breakthrough, and antibody resistance."
      - label: "Imaging and engineering:"
        body: "Geometric flow approaches to images and surfaces; PDE transform; image edge analysis by coupled PDEs; bioluminescence tomography."

  - title: Numerical Methods, Materials, and Dynamical Systems
    items:
      - label: "Computation:"
        body: "Matched interface and boundary (MIB) methods; multidomain interface problems; wavelet local spectral methods; computational electromagnetics; computational fluid dynamics; Richtmyer-Meshkov instability; structural stability analysis."
      - label: "Physics and dynamics:"
        body: "Nano-electronic devices; nanofluidic systems; quantum Boltzmann theory; transport theory; reaction rate theory; controlling chaos; turbulence; and pattern formation."
